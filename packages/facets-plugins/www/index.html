<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Facets Plugins</title>
    <link href="https://fonts.googleapis.com/css?family=IBM+Plex+Sans&display=swap" rel="stylesheet">
    <script type='module' src='../dist/index.js'></script>
    <script type='module' src='../../facets-core/dist/index.js'></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #dfdfdf;
        }

        .facets-group-container {
            width: 300px;
            height: 100%;
            padding: 10px;
            box-sizing: border-box;
        }
    </style>
</head>


<body>
<facet-plugin-zoom-bar>
    min-bar-width="8"
    auto-hide="true"
    round-caps="true"
</facet-plugin-zoom-bar>

<div class="facets-group-container">
    <facet-bars id="facet01" data='{
        "label": "With Zoom Bar",
        "values": [
            { "ratio": 0.1 },
            { "ratio": 0.2 },
            { "ratio": 0.3 },
            { "ratio": 0.4 },
            { "ratio": 0.5 },
            { "ratio": 0.6 },
            { "ratio": 0.7 },
            { "ratio": 0.8 },
            { "ratio": 0.9 },
            { "ratio": 1.0 }
        ]
    }'>
        <div slot="footer">
            <facet-plugin-zoom-bar>
                min-bar-width="8"
                auto-hide="true"
                round-caps="true"
            </facet-plugin-zoom-bar>
        </div>

    </facet-bars>

</div>
<script type="module">

</script>
</body>
</html>
